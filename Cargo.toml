#:schema https://www.schemastore.org/cargo.json

[package]
name = "ts-gate"
version = "0.1.0"
edition = "2024"


[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "fs",
] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "form",
] }
serde = { version = "1.0.229", features = ["derive"] }
hmac = "0.13.0"
sha2 = "0.11.1"
base64 = "0.23.1"

[profile.release]
lto = true
strip = true
