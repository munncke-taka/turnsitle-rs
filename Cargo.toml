#:schema https://www.schemastore.org/cargo.json

[package]
name = "ts-gate"
version = "0.1.0"
edition = "2024"


[dependencies]
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-signed"] }
axum = "0.8.9"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "fs",
] }
reqwest = { version = "0.13.5", features = [
    "json",
    "form",
] }
serde = { version = "1.0.229", features = ["derive"] }
hmac = "0.13.0"
sha2 = "0.11.1"
base64 = "0.23.1"
dotenvy = "0.15.7"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
time = "0.3.55"
[profile.release]
lto = true
strip = true
