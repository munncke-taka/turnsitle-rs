# Test configuration: nginx gating a hello-world page with ts-gate.
# Mirrors temp/ts-gate-server.conf and temp/ts-gate.conf, with two differences:
#   * the verify subrequest is /_ts/verify, the same path ts-gate serves
#   * the gate is applied to `/` directly so the test needs no extra setup.

server {
    listen 80;
    server_name _;

    # Internal subrequest: 204 = cookie valid, 401 = challenge needed.
    location = /_ts/verify {
        internal;
        proxy_pass http://127.0.0.1:9000;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Forwarded-From $remote_addr;
    }

    # Challenge page, shown in place of the protected content.
    location @ts_challenge {
        rewrite ^ /_ts/challenge? break;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header X-Forwarded-From $remote_addr;
        proxy_set_header X-Original-URI $request_uri;
    }

    # Challenge page (GET) and form target (POST). Not gated.
    location = /_ts/challenge {
        auth_request off;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header X-Forwarded-From $remote_addr;
        proxy_set_header X-Original-URI $request_uri;
    }

    # Protected content: the hello-world page.
    location / {
        auth_request /_ts/verify;
        error_page 401 = @ts_challenge;

        root /usr/share/nginx/html/site;
        index simple.html;
    }
}
