# Builds ts-gate and publishes a GitLab Release when a version tag such as v0.2.0 is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# The same workflow exists for GitHub in .github/workflows/release.yml.

stages:
  - build
  - release

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  PACKAGE_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ts-gate/${CI_COMMIT_TAG}
  ASSET_NAME: ts-gate-${CI_COMMIT_TAG}-x86_64-linux

default:
  # Same Debian release as the Dockerfile build stage and the nginx:stable-bookworm runtime.
  image: rust:1-bookworm

build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/
      - target/
  script:
    - |
      version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
      if [ "${CI_COMMIT_TAG#v}" != "$version" ]; then
        echo "Tag $CI_COMMIT_TAG does not match Cargo.toml version $version" >&2
        exit 1
      fi
    - cargo build --release --locked
    - mkdir -p dist/$ASSET_NAME
    - cp target/release/ts-gate README.md LICENSE deploy/ts-gate.service deploy/ts-gate.env.example dist/$ASSET_NAME/
    - tar -C dist -czf dist/$ASSET_NAME.tar.gz $ASSET_NAME
    - sha256sum dist/$ASSET_NAME.tar.gz > dist/$ASSET_NAME.tar.gz.sha256
    # Upload to the generic package registry so the release can link to stable URLs.
    - |
      for f in dist/$ASSET_NAME.tar.gz dist/$ASSET_NAME.tar.gz.sha256; do
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "$f" "$PACKAGE_URL/$(basename "$f")"
      done
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [build]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: "ts-gate $CI_COMMIT_TAG"
    assets:
      links:
        - name: $ASSET_NAME.tar.gz
          url: $PACKAGE_URL/$ASSET_NAME.tar.gz
          link_type: package
        - name: $ASSET_NAME.tar.gz.sha256
          url: $PACKAGE_URL/$ASSET_NAME.tar.gz.sha256
          link_type: other
