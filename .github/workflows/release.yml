name: Release

# Runs when a version tag such as v0.2.0 is pushed:
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          name="ts-gate-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir "$name"
          cp target/release/ts-gate README.md LICENSE \
             deploy/ts-gate.service deploy/ts-gate.env.example "$name"/
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ./ts-gate-*.tar.gz ./ts-gate-*.tar.gz.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
